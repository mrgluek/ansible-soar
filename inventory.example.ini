# Copy to inventory.ini (git-ignored) or add the [soar] group to your own
# inventory. Never commit real zones or server names: they are all it takes
# to block the tunnel.
[soar]
ns.example.net ansible_user=root soar_zone=t.example.net

# Optional per-host settings (defaults in soar_setup.yml):
#   soar_ns=ns.example.net     host the zone is delegated to (default: inventory name)
#   soar_iface=eth0            public interface (default: from facts)
#   soar_port=5302             soar's own UDP port behind the 53 redirect
#   soar_stats=false           skip traffic counters
#   soar_relays_file=/path     relay list (default: soar-relays.txt next to this file)
#   soar_asn_labels_file=/path resolver network labels for soar-stats (default: soar-asn-labels.txt, optional)
#   soar_key=...               private key from ansible-vault (moving a server)
